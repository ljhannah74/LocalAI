
name: LocalAI CI

on:
  push:
  pull_request:

jobs:
  dotnet:
    name: Build and test .NET
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore LocalAI.slnx

      - name: Build solution
        run: dotnet build LocalAI.slnx --configuration Release --no-restore

      - name: Run tests
        run: dotnet test LocalAI.slnx --configuration Release --no-restore

  frontend:
    name: Build React frontend
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: localai-web

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: localai-web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build
